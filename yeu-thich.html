<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tin yêu thích - Chợ Phú Thọ</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/marketplace-v2.css?v=20260916-2"><link rel="stylesheet" href="css/mobile-reference-v2.css?v=20260917-2"></head><body><header class="site-header"><div class="topbar container-wide"><a href="index.html" class="logo">🛒 <span>Chợ Phú Thọ</span></a><a href="tai-khoan.html" class="top-manage">Tài khoản</a><a href="dang-tin.html" class="post-button">+ Đăng tin</a></div></header><main class="container"><div class="section-heading"><div><span class="eyebrow">ĐÃ LƯU</span><h1>Tin yêu thích</h1></div><a href="index.html" class="see-all">← Trang chủ</a></div><div id="favoritesList" class="products"><div class="loading">Đang tải tin đã lưu...</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/main.js"></script><script src="js/marketplace.js"></script><script src="js/marketplace-fixes.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const box=document.getElementById('favoritesList'),u=(await supabaseClient.auth.getUser()).data?.user;if(!u){location.href='dang-nhap.html?next=yeu-thich.html';return}const {data:favs,error}=await supabaseClient.from('favorites').select('listing_id').eq('user_id',u.id).order('created_at',{ascending:false});if(error||!favs?.length){box.innerHTML='<div class="empty-state"><h3>Chưa có tin yêu thích</h3><p>Bấm ♡ trên tin đăng để lưu lại.</p><a href="index.html" class="primary-button">Khám phá tin</a></div>';return}const ids=favs.map(x=>x.listing_id),{data:listings}=await supabaseClient.from('listings').select('*').in('id',ids).eq('status','approved'),byId=Object.fromEntries((listings||[]).map(x=>[x.id,x])),ordered=ids.map(id=>byId[id]).filter(Boolean);box.innerHTML=ordered.map(x=>`<article class="product"><a class="product-link" href="chi-tiet.html?id=${encodeURIComponent(x.id)}"><div class="image-wrap"><div class="image-placeholder">📦</div></div><div class="product-content"><div class="listing-category">${escapeHtml(x.category||x.network||'Khác')}</div><div class="title">${escapeHtml(x.title)}</div><div class="price">${formatPrice(x.price)}</div><div class="location-small">📍 ${escapeHtml(x.location||'Phú Thọ')}</div></div></a><button class="favorite-button" data-favorite="${x.id}">♥</button></article>`).join('');box.querySelectorAll('[data-favorite]').forEach(b=>b.onclick=async()=>{await window.toggleFavorite(b.dataset.favorite,b);b.closest('.product').remove()})});</script></body></html>
