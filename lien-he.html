<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Liên hệ hỗ trợ - Chợ Phú Thọ</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><div class="topbar container-wide"><a href="index.html" class="logo">🛒 Chợ Phú Thọ</a><a href="index.html" class="top-manage">Trang chủ</a></div></header><main class="container"><div class="auth-box"><span class="eyebrow">HỖ TRỢ</span><h1>Liên hệ Chợ Phú Thọ</h1><p>Gửi yêu cầu hỗ trợ về tài khoản, tin đăng, thanh toán hoặc báo cáo nội dung.</p><label>Họ tên</label><input id="name" placeholder="Nguyễn Văn A"><label>Email</label><input id="email" type="email" placeholder="email@example.com"><label>Nội dung</label><textarea id="message" rows="7" placeholder="Mô tả vấn đề cần hỗ trợ..."></textarea><button class="btn-post" type="button" onclick="sendSupport()">Gửi yêu cầu</button><p id="supportResult" class="muted"></p></div></main><script>function sendSupport(){const n=document.getElementById('name').value.trim(),e=document.getElementById('email').value.trim(),m=document.getElementById('message').value.trim();if(!n||!e||!m){alert('Vui lòng nhập đầy đủ thông tin.');return;}document.getElementById('supportResult').textContent='Đã ghi nhận yêu cầu. Bạn có thể gửi email hỗ trợ trực tiếp từ ứng dụng email của mình nếu cần.';window.location.href='mailto:trogiup@chophutho.vn?subject='+encodeURIComponent('Hỗ trợ Chợ Phú Thọ - '+n)+'&body='+encodeURIComponent(m+'\n\nEmail: '+e);}</script></body></html>
