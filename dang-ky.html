<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - Chợ Phú Thọ</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><div class="header"><a href="index.html" class="logo">🛒 Chợ Phú Thọ</a><a href="index.html">Trang chủ</a></div></header>
<main class="container">
    <div class="auth-box">
        <h2>Tạo tài khoản</h2>
        <p>Mua bán SIM số đẹp tại Phú Thọ</p>
        <label>Họ và tên</label><input type="text" id="fullname" placeholder="Nguyễn Văn A">
        <label>Số điện thoại</label><input type="tel" id="phone" placeholder="0988 888 888">
        <label>Email</label><input type="email" id="email" placeholder="email@example.com">
        <label>Mật khẩu</label><input type="password" id="password" placeholder="Ít nhất 6 ký tự">
        <label>Bạn là</label>
        <select id="accountType"><option value="customer">👤 Khách hàng</option><option value="seller">🏪 Nhà bán hàng</option></select>
        <button class="btn-post" onclick="registerUser()">Đăng ký</button>
        <p class="auth-link">Đã có tài khoản? <a href="dang-nhap.html">Đăng nhập</a></p>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
