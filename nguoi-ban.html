<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Trang cửa hàng và người bán trên Chợ Phú Thọ."><link rel="icon" href="favicon.svg"><link rel="manifest" href="manifest.webmanifest"><title>Trang người bán - Chợ Phú Thọ</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><div class="topbar container-wide"><a href="index.html" class="logo">🛒 <span>Chợ Phú Thọ</span></a><a href="index.html" class="top-manage">Trang chủ</a><a href="dang-tin.html" class="post-button">+ Đăng tin</a></div></header><main class="container"><section class="auth-box wide-box" id="sellerProfile"><div class="loading">Đang tải thông tin người bán...</div></section><section class="section-block"><div class="section-heading"><h2>Tin đang đăng</h2></div><div class="seller-products" id="sellerListings"><div class="loading">Đang tải...</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/main.js"></script><script src="js/marketplace.js"></script><script src="js/platform.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const id=new URLSearchParams(location.search).get('id'),profileBox=document.getElementById('sellerProfile'),listingBox=document.getElementById('sellerListings');if(!id){profileBox.innerHTML='<div class="empty-state">Không tìm thấy người bán.</div>';return;}const {data:profile,error:pErr}=await supabaseClient.from('profiles').select('full_name,phone,shop_name,shop_description,verified_at,avatar_url').eq('id',id).maybeSingle();if(pErr||!profile){profileBox.innerHTML='<div class="empty-state">Không tìm thấy người bán.</div>';return;}const {data:reviews}=await supabaseClient.from('reviews').select('rating').eq('seller_id',id).eq('status','approved');const rows=reviews||[],avg=rows.length?rows.reduce((s,r)=>s+Number(r.rating),0)/rows.length:0,me=(await supabaseClient.auth.getUser()).data?.user;const {count:followers}=await supabaseClient.from('store_followers').select('id',{count:'exact',head:true}).eq('store_id',id);let followed=false;if(me){const {data:f}=await supabaseClient.from('store_followers').select('id').eq('store_id',id).eq('follower_id',me.id).maybeSingle();followed=!!f;}const phone=profile.phone||'';profileBox.innerHTML=`<div class="seller-profile-head">${profile.avatar_url?`<img class="seller-avatar" src="${escapeHtml(profile.avatar_url)}" alt="Ảnh đại diện">`:'<div class="seller-avatar seller-avatar-fallback">👤</div>'}<div><span class="eyebrow">${profile.shop_name?'CỬA HÀNG / NGƯỜI BÁN':'NGƯỜI BÁN'}</span><h2>${escapeHtml(profile.shop_name||profile.full_name||'Người bán')}</h2><p class="muted">${escapeHtml(profile.shop_description||'Người bán trên Chợ Phú Thọ.')}</p><div class="seller-trust">${profile.verified_at?'✅ Đã xác minh nhà bán hàng':''} ${avg?` · ⭐ ${avg.toFixed(1)}/5 (${rows.length} đánh giá)`:''} · 👥 ${followers||0} người theo dõi</div>${phone?`<a class="contact-phone" href="tel:${phone.replace(/[^0-9+]/g,'')}">☎️ Gọi người bán</a>`:''}<a class="outline-button detail-action" href="chat.html?user=${encodeURIComponent(id)}">💬 Chat</a><button class="outline-button detail-action" id="followStore">${followed?'♥ Đang theo dõi':'♡ Theo dõi cửa hàng'}</button></div></div>`;document.getElementById('followStore').addEventListener('click',async()=>{if(!me){location.href='dang-nhap.html';return;}if(followed){await supabaseClient.from('store_followers').delete().eq('store_id',id).eq('follower_id',me.id);followed=false;}else{const {error}=await supabaseClient.from('store_followers').insert({store_id:id,follower_id:me.id});if(error){alert('Không thể theo dõi cửa hàng.');return;}followed=true;}document.getElementById('followStore').textContent=followed?'♥ Đang theo dõi':'♡ Theo dõi cửa hàng';});const {data:listings}=await supabaseClient.from('listings').select('*').eq('seller_id',id).eq('status','approved').order('created_at',{ascending:false});if(!listings?.length){listingBox.innerHTML='<div class="empty-state">Người này chưa có tin đang hiển thị.</div>';return;}window.homeListingImages={};for(const item of listings){window.homeListingImages[item.id]=await loadImages(item.id);}listingBox.innerHTML=listings.map(item=>{const img=window.homeListingImages[item.id]?.[0]?.image_url||'',fallback=typeof SERVICE_PLACEHOLDER!=='undefined'?SERVICE_PLACEHOLDER:'';return `<a href="chi-tiet.html?id=${encodeURIComponent(item.id)}" class="product-link"><article class="product"><img src="${img||fallback}" alt="${escapeHtml(item.title)}"><div class="product-content"><div class="listing-category">${escapeHtml(item.category||item.network||'Khác')}</div><div class="title">${escapeHtml(item.title)}</div><div class="price">${formatPrice(item.price)}</div><div class="location-small">📍 ${escapeHtml(item.location||'Phú Thọ')}</div></div></article></a>`;}).join('');});</script></body></html>
