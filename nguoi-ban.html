<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffba00"><meta name="description" content="Trang cửa hàng và người bán trên Chợ Phú Thọ."><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/marketplace-v2.css?v=20260916-9"><title>Người bán - Chợ Phú Thọ</title></head><body><header class="site-header"><div class="topbar container-wide"><a href="index.html" class="logo"><img src="favicon.svg" alt="Chợ Phú Thọ" style="width:34px;height:34px;border-radius:10px;vertical-align:middle;margin-right:6px"><span>Chợ Phú Thọ</span></a><a href="index.html" class="top-manage">Trang chủ</a><a href="dang-tin.html" class="post-button">+ Đăng tin</a></div></header><main class="container seller-page"><div id="sellerProfile" class="seller-profile"><div class="loading">Đang tải thông tin người bán...</div></div><section class="section-block"><div class="section-heading"><div><span class="eyebrow">CỬA HÀNG</span><h2>Tin đang đăng</h2></div><span id="listingCount" class="section-note"></span></div><div class="seller-products" id="sellerListings"><div class="loading">Đang tải...</div></div></section></main><nav class="mobile-bottom-nav" aria-label="Điều hướng mobile"><a class="mobile-nav-item" href="index.html">⌂<span>Trang chủ</span></a><a class="mobile-nav-item" href="quan-ly-tin.html">▤<span>Quản lý tin</span></a><a class="mobile-nav-post" href="dang-tin.html">＋<span>Đăng tin</span></a><a class="mobile-nav-item" href="chat.html">◌<span>Tin nhắn</span></a><a class="mobile-nav-item" href="tai-khoan.html">●<span>Tài khoản</span></a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js?v=20260916-2"></script><script src="js/main.js?v=20260916-5"></script><script src="js/platform.js?v=20260916-6"></script><script>
(function(){
  const esc=v=>typeof escapeHtml==='function'?escapeHtml(v):String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));
  const fmt=v=>{const n=Number(v);return Number.isFinite(n)&&n>0?n.toLocaleString('vi-VN')+' đ':'Thỏa thuận'};
  const qs=new URLSearchParams(location.search),id=qs.get('id');
  const profileBox=document.getElementById('sellerProfile'),listingBox=document.getElementById('sellerListings'),countBox=document.getElementById('listingCount');
  async function load(){
    if(!id){profileBox.innerHTML='<div class="empty-state"><h3>Không tìm thấy người bán</h3><a href="index.html">← Về trang chủ</a></div>';return;}
    try{
      const {data:profile,error:pErr}=await supabaseClient.from('profiles').select('id,full_name,phone,role,shop_name,shop_description,verified_at,avatar_url,created_at').eq('id',id).maybeSingle();
      if(pErr||!profile){profileBox.innerHTML='<div class="empty-state"><h3>Không tìm thấy dữ liệu người bán</h3><p>Trang người bán có thể đã bị xóa hoặc tài khoản chưa hoàn tất hồ sơ.</p></div>';return;}
      const [{data:listings,error:lErr},{data:reviews},{data:follows}]=await Promise.all([
        supabaseClient.from('listings').select('id,title,price,location,category,created_at').eq('seller_id',id).eq('status','approved').order('created_at',{ascending:false}),
        supabaseClient.from('reviews').select('rating').eq('seller_id',id).eq('status','approved'),
        supabaseClient.rpc('get_store_follower_count',{p_store_id:id})
      ]);
      if(lErr)throw lErr;
      const rows=reviews||[],avg=rows.length?rows.reduce((s,r)=>s+Number(r.rating),0)/rows.length:0;
      const followerCount=Number(follows?.data||0);
      const me=(await supabaseClient.auth.getUser()).data?.user||null;
      let followed=false;if(me){const {data:f}=await supabaseClient.from('store_followers').select('id').eq('store_id',id).eq('follower_id',me.id).maybeSingle();followed=!!f;}
      const name=profile.shop_name||profile.full_name||'Người bán';
      const since=profile.created_at?new Date(profile.created_at).toLocaleDateString('vi-VN',{month:'2-digit',year:'numeric'}):'';
      profileBox.innerHTML=`<div class="seller-profile-head"><div class="seller-avatar seller-avatar-big">${profile.avatar_url?`<img src="${esc(profile.avatar_url)}" alt="Ảnh ${esc(name)}">`:'👤'}</div><div class="seller-profile-main"><span class="eyebrow">${profile.shop_name?'CỬA HÀNG':'NGƯỜI BÁN'}</span><h1>${esc(name)}</h1><div class="seller-badges">${profile.verified_at?'<span>✓ Đã xác minh</span>':''}<span>📍 Phú Thọ</span>${since?`<span>Tham gia ${since}</span>`:''}</div><p>${esc(profile.shop_description||'Người bán đang giao dịch trên Chợ Phú Thọ. Liên hệ trực tiếp để trao đổi về sản phẩm và dịch vụ.')}</p><div class="seller-stats"><strong>${listings?.length||0}<small>Tin đang bán</small></strong><strong>${avg?avg.toFixed(1):'—'}<small>Đánh giá${rows.length?' ('+rows.length+')':''}</small></strong><strong>${followerCount}<small>Người theo dõi</small></strong></div><div class="seller-actions"><a class="detail-action primary" href="chat.html?user=${encodeURIComponent(id)}">💬 Trao đổi online</a>${profile.phone?`<a class="detail-action" href="tel:${String(profile.phone).replace(/[^0-9+]/g,'')}">☎ Gọi người bán</a>`:''}<button class="detail-action" id="followStore">${followed?'♥ Đang theo dõi':'♡ Theo dõi cửa hàng'}</button></div></div></div>`;
      document.getElementById('followStore').onclick=async()=>{if(!me){location.href='dang-nhap.html?next='+encodeURIComponent(location.href);return;}const btn=document.getElementById('followStore');btn.disabled=true;if(followed){const r=await supabaseClient.from('store_followers').delete().eq('store_id',id).eq('follower_id',me.id);if(r.error){alert('Không thể bỏ theo dõi.');btn.disabled=false;return;}followed=false;}else{const r=await supabaseClient.from('store_followers').insert({store_id:id,follower_id:me.id});if(r.error){alert('Không thể theo dõi cửa hàng: '+r.error.message);btn.disabled=false;return;}followed=true;}btn.textContent=followed?'♥ Đang theo dõi':'♡ Theo dõi cửa hàng';btn.disabled=false;};
      countBox.textContent=`${listings?.length||0} tin`;
      if(!listings?.length){listingBox.innerHTML='<div class="empty-state"><p>Người bán chưa có tin đang hiển thị.</p></div>';return;}
      const ids=listings.map(x=>x.id),{data:imgs}=await supabaseClient.from('listing_images').select('listing_id,image_url,sort_order').in('listing_id',ids).order('sort_order',{ascending:true});
      const imageMap={};for(const x of imgs||[]){if(!imageMap[x.listing_id])imageMap[x.listing_id]=x.image_url;}
      const fallback='data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600"><rect width="100%" height="100%" fill="#f4f4f4"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-size="36" fill="#999">Chợ Phú Thọ</text></svg>');
      listingBox.innerHTML=listings.map(item=>`<a href="chi-tiet.html?id=${encodeURIComponent(item.id)}" class="product-link"><article class="product"><img src="${esc(imageMap[item.id]||fallback)}" alt="${esc(item.title)}" loading="lazy"><div class="product-content"><div class="listing-category">${esc(item.category||'Khác')}</div><div class="title">${esc(item.title)}</div><div class="price">${fmt(item.price)}</div><div class="location-small">📍 ${esc(item.location||'Phú Thọ')}</div></div></article></a>`).join('');
    }catch(e){console.error(e);profileBox.innerHTML='<div class="empty-state"><h3>Không thể tải trang người bán</h3><p>Vui lòng thử lại sau.</p><a href="index.html">← Về trang chủ</a></div>';}
  }
  document.addEventListener('DOMContentLoaded',load);
})();
</script></body></html>
