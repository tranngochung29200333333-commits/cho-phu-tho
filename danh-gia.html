<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Đánh giá của tôi | Chợ Phú Thọ</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/professional-upgrade.css?v=20260917-1"></head><body><header class="site-header"><div class="topbar container-wide"><a href="index.html" class="logo">🛒 Chợ Phú Thọ</a><div class="admin-header-actions"><a class="top-manage" href="ban-hang.html">Dashboard</a><a class="top-manage" href="quan-ly-tin.html">Quản lý tin</a><a class="top-manage" href="chat.html">Tin nhắn</a></div></div></header><main class="container pt-dashboard"><section class="pt-dashboard-head"><div><span class="eyebrow">UY TÍN CỬA HÀNG</span><h1>Đánh giá của tôi</h1><p>Xem phản hồi và trả lời đánh giá của khách hàng.</p></div></section><section class="pt-stat-grid"><article class="pt-stat"><div class="pt-stat-label">Điểm trung bình</div><div class="pt-stat-value"><span id="avg">0</span> <span class="pt-rating">★</span></div></article><article class="pt-stat"><div class="pt-stat-label">Tổng đánh giá</div><div class="pt-stat-value" id="total">0</div></article><article class="pt-stat"><div class="pt-stat-label">5 sao</div><div class="pt-stat-value" id="five">0</div></article><article class="pt-stat"><div class="pt-stat-label">Chưa phản hồi</div><div class="pt-stat-value" id="unreplied">0</div></article></section><section class="pt-panel"><div id="reviewBox"><div class="pt-empty">Đang tải...</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js?v=20260917-1"></script><script>(async()=>{const box=document.getElementById('reviewBox');const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));try{const{data:u}=await supabaseClient.auth.getUser();if(!u?.user){location.href='dang-nhap.html?next=danh-gia.html';return}const{data:p}=await supabaseClient.from('profiles').select('role').eq('id',u.user.id).maybeSingle();if(!['seller','admin'].includes(p?.role)){location.href='tai-khoan.html';return}const{data:r,error}=await supabaseClient.from('reviews').select('id,rating,body,seller_reply,seller_replied_at,created_at,listing_id,profiles:reviewer_id(full_name),listings:listing_id(title)').eq('seller_id',u.user.id).eq('status','approved').order('created_at',{ascending:false});if(error)throw error;r=r||[];const avg=r.length?(r.reduce((a,x)=>a+Number(x.rating||0),0)/r.length).toFixed(1):'0';document.getElementById('avg').textContent=avg;document.getElementById('total').textContent=r.length;document.getElementById('five').textContent=r.filter(x=>Number(x.rating)===5).length;document.getElementById('unreplied').textContent=r.filter(x=>!x.seller_reply).length;if(!r.length){box.innerHTML='<div class="pt-empty">Chưa có đánh giá công khai.</div>';return}box.innerHTML=r.map(x=>'<article class="pt-panel" style="box-shadow:none;margin:0 0 12px"><div style="display:flex;justify-content:space-between;gap:10px"><div><b>'+esc(x.profiles?.full_name||'Khách hàng')+'</b><div class="pt-rating">'+('★'.repeat(Number(x.rating||0)))+('☆'.repeat(5-Number(x.rating||0)))+'</div></div><small>'+new Date(x.created_at).toLocaleDateString('vi-VN')+'</small></div><p>'+esc(x.body||'Không có nhận xét.')+'</p><small>Tin: '+esc(x.listings?.title||'Tin đăng')+'</small>'+(x.seller_reply?'<div style="margin-top:12px;padding:12px;background:#f7f7f8;border-radius:12px"><b>Phản hồi của bạn</b><p style="margin:6px 0 0">'+esc(x.seller_reply)+'</p></div>':'<form class="pt-form" data-review="'+x.id+'" style="margin-top:12px"><textarea maxlength="1000" placeholder="Viết phản hồi lịch sự cho khách hàng..."></textarea><button class="pt-action primary" type="submit">Gửi phản hồi</button></form>')+'</article>').join('');box.querySelectorAll('form[data-review]').forEach(f=>f.onsubmit=async e=>{e.preventDefault();const id=f.dataset.review,reply=f.querySelector('textarea').value.trim();if(!reply)return;const{error}=await supabaseClient.rpc('reply_to_review',{p_review_id:id,p_reply:reply});if(error){ptToast('Không thể gửi phản hồi');return}ptToast('Đã gửi phản hồi');location.reload()})}catch(e){console.error(e);box.innerHTML='<div class="pt-empty">Không thể tải đánh giá.</div>'}})();</script></body></html>
