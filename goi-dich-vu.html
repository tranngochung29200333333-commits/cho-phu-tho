<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gói dịch vụ | Chợ Phú Thọ</title><link rel="icon" href="favicon.svg"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/commerce.css"></head><body><header class="site-header"><div class="topbar container-wide"><a href="index.html" class="logo">🛒 <span>Chợ Phú Thọ</span></a><a href="index.html" class="top-manage">Trang chủ</a><a href="quan-ly-tin.html" class="top-manage">Tin của tôi</a></div></header><main class="container"><section class="auth-box wide-box"><span class="eyebrow">TĂNG HIỆU QUẢ TIN ĐĂNG</span><h1>Gói dịch vụ</h1><p>Chọn gói để tăng khả năng hiển thị. Hiện hệ thống nhận đơn và chờ Admin xác nhận thanh toán.</p><div id="packages" class="package-grid"><div class="loading">Đang tải...</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/main.js"></script><script src="js/platform.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const box=document.getElementById('packages');const {data:userData}=await supabaseClient.auth.getUser();if(!userData.user){box.innerHTML='<div class="empty-state"><h3>Đăng nhập để sử dụng</h3><a class="btn-post" href="dang-nhap.html">Đăng nhập</a></div>';return;}const {data,error}=await supabaseClient.from('promotion_packages').select('*').eq('active',true).order('price');if(error){box.innerHTML='<div class="empty-state">Không tải được gói dịch vụ.</div>';return;}box.innerHTML=(data||[]).map(p=>`<article class="package-card"><span class="listing-badge">${escapeHtml(p.code)}</span><h3>${escapeHtml(p.name)}</h3><p>${escapeHtml(p.description||'')}</p><strong>${Number(p.price).toLocaleString('vi-VN')} đ</strong><small>${p.duration_days} ngày</small><button class="btn-post" data-package="${p.id}">Chọn gói</button></article>`).join('')||'<div class="empty-state">Chưa có gói dịch vụ.</div>';box.querySelectorAll('[data-package]').forEach(btn=>btn.addEventListener('click',async()=>{const listing=prompt('Nhập mã ID tin đăng cần áp dụng gói:');if(!listing)return;const selected=(data||[]).find(x=>x.id===btn.dataset.package);const {data:order,error:oerr}=await supabaseClient.from('payment_orders').insert({user_id:userData.user.id,listing_id:Number(listing),package_id:selected.id,amount:selected.price,method:'manual',status:'pending',note:'Chờ Admin xác nhận thanh toán'}).select('id').single();if(oerr){alert('Không tạo được đơn: '+oerr.message);return;}alert('Đã tạo đơn #'+order.id+'. Admin sẽ xác nhận thanh toán và kích hoạt gói.');}));});</script></body></html>
