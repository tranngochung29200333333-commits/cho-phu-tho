<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffba00"><title>Gói dịch vụ | Chợ Phú Thọ</title><link rel="icon" href="favicon.svg"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/commerce.css"><link rel="stylesheet" href="css/professional-upgrade.css?v=20260917-1"></head><body><header class="site-header"><div class="topbar container-wide"><a href="index.html" class="logo">🛒 <span>Chợ Phú Thọ</span></a><div class="admin-header-actions"><a href="ban-hang.html" class="top-manage">Dashboard</a><a href="quan-ly-tin.html" class="top-manage">Tin của tôi</a><a href="index.html" class="top-manage">Trang chủ</a></div></div></header><main class="container pt-dashboard"><section class="pt-dashboard-head"><div><span class="eyebrow">TĂNG HIỆU QUẢ TIN ĐĂNG</span><h1>Gói dịch vụ</h1><p>Chọn tin, chọn gói và tạo đơn. Admin sẽ xác nhận thanh toán rồi kích hoạt dịch vụ.</p></div></section><section class="pt-panel"><form id="orderForm" class="pt-form"><label>Tin đăng<select id="listingSelect" required><option value="">Đang tải tin...</option></select></label><div id="packages" class="pt-stat-grid" style="margin:0"><div class="pt-empty">Đang tải gói...</div></div><input type="hidden" id="packageId"><div class="pt-grid-2"><label>Phương thức thanh toán<select id="method"><option value="manual">Chuyển khoản / xác nhận thủ công</option><option value="cash">Thanh toán trực tiếp</option></select></label><label>Ghi chú<textarea id="note" placeholder="Nội dung thêm cho Admin (không bắt buộc)"></textarea></label></div><button class="pt-action primary" type="submit">Tạo đơn dịch vụ</button></form></section><section class="pt-panel table-wrap"><h2>Đơn dịch vụ của tôi</h2><div id="orders"><div class="pt-empty">Đang tải...</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js?v=20260917-4"></script><script>(async()=>{const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));const fmt=n=>Number(n||0).toLocaleString('vi-VN')+' đ';try{const{data:u}=await supabaseClient.auth.getUser();if(!u?.user){location.href='dang-nhap.html?next=goi-dich-vu.html';return}const{data:listings}=await supabaseClient.from('listings').select('id,title,price,status').eq('seller_id',u.user.id).in('status',['approved','pending']).order('created_at',{ascending:false});const ls=document.getElementById('listingSelect');ls.innerHTML='<option value="">-- Chọn tin đăng --</option>'+(listings||[]).map(l=>'<option value="'+l.id+'">'+esc(l.title)+' · '+esc(l.status)+'</option>').join('');const{data:packages,error}=await supabaseClient.from('promotion_packages').select('*').eq('active',true).order('price');if(error)throw error;const pb=document.getElementById('packages');pb.innerHTML=(packages||[]).map((p,i)=>'<article class="pt-stat" data-pkg="'+p.id+'" style="cursor:pointer;border:2px solid '+(i===0?'#ffba00':'#e5e7eb')+'"><div class="pt-stat-label">'+esc(p.code)+'</div><div class="pt-stat-value" style="font-size:22px">'+esc(p.name)+'</div><div class="pt-stat-note">'+esc(p.description||'')+'</div><b>'+fmt(p.price)+'</b><div class="pt-stat-note">'+p.duration_days+' ngày</div></article>').join('')||'<div class="pt-empty">Chưa có gói dịch vụ.</div>';let selected=packages?.[0];if(selected)document.getElementById('packageId').value=selected.id;pb.querySelectorAll('[data-pkg]').forEach(el=>el.onclick=()=>{selected=packages.find(p=>p.id===el.dataset.pkg);document.getElementById('packageId').value=selected.id;pb.querySelectorAll('[data-pkg]').forEach(x=>x.style.borderColor='#e5e7eb');el.style.borderColor='#ffba00'});document.getElementById('orderForm').onsubmit=async e=>{e.preventDefault();const listingId=Number(ls.value),packageId=document.getElementById('packageId').value;if(!listingId||!packageId){ptToast('Hãy chọn tin và gói dịch vụ');return}const p=packages.find(x=>x.id===packageId);const{data:o,error}=await supabaseClient.from('payment_orders').insert({user_id:u.user.id,listing_id:listingId,package_id:packageId,amount:p.price,method:document.getElementById('method').value,status:'pending',note:document.getElementById('note').value.trim()}).select('id').single();if(error){ptToast('Không tạo được đơn: '+error.message);return}ptToast('Đã tạo đơn dịch vụ #'+o.id);document.getElementById('note').value='';await loadOrders()};async function loadOrders(){const{data,error}=await supabaseClient.from('payment_orders').select('id,amount,method,status,created_at,paid_at,listings:listing_id(title),promotion_packages:package_id(name)').eq('user_id',u.user.id).order('created_at',{ascending:false}).limit(30);const box=document.getElementById('orders');if(error){box.innerHTML='<div class="pt-empty">Không tải được đơn hàng.</div>';return}if(!data?.length){box.innerHTML='<div class="pt-empty">Bạn chưa có đơn dịch vụ.</div>';return}box.innerHTML='<table class="pt-table"><thead><tr><th>Đơn</th><th>Tin</th><th>Gói</th><th>Số tiền</th><th>Trạng thái</th><th>Ngày</th></tr></thead><tbody>'+data.map(x=>'<tr><td>#'+x.id+'</td><td>'+esc(x.listings?.title||'')+'</td><td>'+esc(x.promotion_packages?.name||'')+'</td><td>'+fmt(x.amount)+'</td><td><span class="pt-status '+(x.status==='paid'?'approved':x.status==='pending'?'pending':'hidden')+'">'+esc(x.status)+'</span></td><td>'+new Date(x.created_at).toLocaleDateString('vi-VN')+'</td></tr>').join('')+'</tbody></table>'}await loadOrders()}catch(e){console.error(e);ptToast('Không tải được dữ liệu gói dịch vụ')}})();</script></body></html>
