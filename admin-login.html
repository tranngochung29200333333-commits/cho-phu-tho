<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin - Chợ Phú Thọ</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>

<header class="header">

    <div class="container">

        <a href="index.html"
           class="logo">

            🛒 Chợ Phú Thọ

        </a>

    </div>

</header>


<main class="container">

    <div class="auth-box">

        <h2>🔐 Admin</h2>

        <p>
            Đăng nhập quản trị website
        </p>


        <label>
            Tên đăng nhập
        </label>

        <input
            type="text"
            id="adminUsername"
            placeholder="admin"
        >


        <label>
            Mật khẩu
        </label>

        <input
            type="password"
            id="adminPassword"
            placeholder="Mật khẩu"
        >


        <button
            class="btn-post"
            onclick="adminLogin()">

            Đăng nhập Admin

        </button>


        <div class="auth-link">

            <a href="index.html">
                ← Về trang chủ
            </a>

        </div>

    </div>

</main>


<script src="js/main.js"></script>

</body>

</html>
