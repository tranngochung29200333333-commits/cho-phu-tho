<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Chợ Phú Thọ</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><div class="header"><a href="index.html" class="logo">🛒 Chợ Phú Thọ</a></div></header>
<main class="container">
    <div class="auth-box">
        <h2>🔐 Đăng nhập quản trị</h2>
        <p>Dùng tài khoản Supabase có quyền Admin.</p>
        <label>Email</label><input type="email" id="adminEmail" placeholder="admin@example.com">
        <label>Mật khẩu</label><input type="password" id="adminPassword" placeholder="Mật khẩu">
        <button class="btn-post" onclick="adminLogin()">Đăng nhập Admin</button>
        <p class="auth-link"><a href="index.html">← Về trang chủ</a></p>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script>
async function adminLogin(){
    const email=document.getElementById('adminEmail').value.trim();
    const password=document.getElementById('adminPassword').value;
    if(!email||!password){alert('Vui lòng nhập email và mật khẩu.');return;}
    const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
    if(error){alert('Đăng nhập thất bại: '+error.message);return;}
    const {data:profile}=await supabaseClient.from('profiles').select('role').eq('id',data.user.id).maybeSingle();
    if(profile?.role!=='admin'){
        await supabaseClient.auth.signOut();
        alert('Tài khoản này không có quyền Admin.');
        return;
    }
    window.location.href='admin.html';
}
</script>
</body>
</html>
