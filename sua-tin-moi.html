<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffba00"><title>Sửa tin - Chợ Phú Thọ</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/marketplace-v2.css?v=20260916-10"></head><body><header class="site-header"><div class="topbar container-wide"><a href="index.html" class="logo"><img src="favicon.svg" alt="Chợ Phú Thọ" style="width:34px;height:34px;border-radius:10px;vertical-align:middle;margin-right:6px"><span>Chợ Phú Thọ</span></a><a href="quan-ly-tin.html" class="top-manage">Quản lý tin</a></div></header><main class="container"><div class="auth-box wide-box"><span class="eyebrow">QUẢN LÝ TIN</span><h2>Sửa tin đăng</h2><p>Sau khi sửa, tin sẽ được chuyển về trạng thái chờ Admin duyệt lại.</p><p id="editStatus" class="muted">Đang tải tin...</p><form id="editListingForm" hidden onsubmit="event.preventDefault();saveEditedProduct()"><label>Thông tin liên hệ thêm<input type="text" id="editSimNumber" maxlength="120" placeholder="Zalo / website / mã dịch vụ"></label><label>Tiêu đề<input type="text" id="editTitle" maxlength="140"></label><label>Giá / mức phí<input type="number" id="editPrice" min="0"></label><label>Danh mục<select id="editNetwork"><option>Bất động sản</option><option>Xe cộ</option><option>Điện tử</option><option>Dịch vụ</option><option>Việc làm</option><option>Đồ gia dụng</option><option>Thời trang</option><option>Thú cưng</option><option>Khác</option></select></label><label>Danh mục con<select id="editSubcategory"><option value="">-- Không chọn --</option><option>Nhà bán</option><option>Đất bán</option><option>Phòng trọ</option><option>Cho thuê</option><option>Ô tô</option><option>Xe máy</option><option>Xe tải</option><option>Điện thoại</option><option>Laptop</option><option>Máy tính</option><option>Điện máy</option><option>Sửa chữa</option><option>Vận chuyển</option><option>Vệ sinh</option><option>Xây dựng</option><option>Gia sư</option><option>Tuyển dụng</option><option>Tìm việc</option><option>Làm thêm</option><option>Khác</option></select></label><label>Khu vực<select id="editLocation"><option>Việt Trì</option><option>Phú Thọ</option><option>Lâm Thao</option><option>Cẩm Khê</option><option>Hạ Hòa</option><option>Thanh Sơn</option><option>Tân Sơn</option><option>Yên Lập</option><option>Thanh Ba</option><option>Đoan Hùng</option><option>Phù Ninh</option><option>Thanh Thủy</option><option>Tam Nông</option></select></label><label>Số điện thoại liên hệ<input type="tel" id="editContactPhone" maxlength="20" placeholder="09xxxxxxxx"></label><label>Zalo<input type="text" id="editContactZalo" maxlength="100" placeholder="Số Zalo hoặc tên Zalo"></label><label>Mô tả<textarea id="editDescription" rows="8" maxlength="5000"></textarea></label><button class="btn-post" type="submit" id="saveEditButton">Lưu thay đổi</button><a class="detail-action" style="margin-top:10px" href="quan-ly-tin.html">Hủy và quay lại</a></form></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js?v=20260916-3"></script><script src="js/edit-listing.js?v=20260916-2"></script></body></html>
