<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sửa tin - Chợ Phú Thọ</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
    <div class="header">
        <a href="index.html" class="logo">🛒 Chợ Phú Thọ</a>
        <a href="quan-ly-tin.html">Quản lý tin</a>
    </div>
</header>
<main class="container">
    <div class="auth-box">
        <h2>Sửa tin đăng</h2>
        <p>Thay đổi thông tin SIM. Sau khi sửa, tin sẽ chờ Admin duyệt lại.</p>
        <label>Số SIM</label><input type="text" id="editSimNumber">
        <label>Tiêu đề</label><input type="text" id="editTitle">
        <label>Giá bán</label><input type="number" id="editPrice" min="0">
        <label>Nhà mạng</label>
        <select id="editNetwork"><option>Viettel</option><option>Vinaphone</option><option>Mobifone</option><option>Vietnamobile</option></select>
        <label>Khu vực</label>
        <select id="editLocation">
            <option>Việt Trì</option>
            <option>Phú Thọ</option>
            <option>Lâm Thao</option>
            <option>Cẩm Khê</option>
            <option>Hạ Hòa</option>
            <option>Thanh Sơn</option>
            <option>Tân Sơn</option>
            <option>Yên Lập</option>
            <option>Thanh Ba</option>
            <option>Đoan Hùng</option>
            <option>Phù Ninh</option>
            <option>Thanh Thủy</option>
            <option>Tam Nông</option>
        </select>
        <label>Mô tả</label><textarea id="editDescription" rows="7"></textarea>
        <button class="btn-post" onclick="saveEditedProduct()">Lưu thay đổi</button>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/main.js"></script>
</body>
</html>
