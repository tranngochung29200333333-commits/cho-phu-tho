<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sửa tin - Chợ Phú Thọ</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
    <div class="topbar container-wide">
        <a href="index.html" class="logo">🛒 <span>Chợ Phú Thọ</span></a>
        <a href="quan-ly-tin.html" class="top-manage">Quản lý tin</a>
    </div>
</header>
<main class="container">
    <div class="auth-box wide-box">
        <span class="eyebrow">QUẢN LÝ TIN</span>
        <h2>Sửa tin đăng</h2>
        <p>Sau khi sửa, tin sẽ được chuyển về trạng thái chờ Admin duyệt lại.</p>
        <label>Thông tin liên hệ thêm</label><input type="text" id="editSimNumber" placeholder="Zalo / website / mã dịch vụ">
        <label>Tiêu đề</label><input type="text" id="editTitle">
        <label>Giá / mức phí</label><input type="number" id="editPrice" min="0">
        <label>Danh mục</label>
        <select id="editNetwork"><option>Bất động sản</option><option>Xe cộ</option><option>Điện tử</option><option>Dịch vụ</option><option>Việc làm</option><option>Đồ gia dụng</option><option>Thời trang</option><option>Thú cưng</option><option>Khác</option></select>
        <label>Khu vực</label>
        <select id="editLocation"><option>Việt Trì</option><option>Phú Thọ</option><option>Lâm Thao</option><option>Cẩm Khê</option><option>Hạ Hòa</option><option>Thanh Sơn</option><option>Tân Sơn</option><option>Yên Lập</option><option>Thanh Ba</option><option>Đoan Hùng</option><option>Phù Ninh</option><option>Thanh Thủy</option><option>Tam Nông</option></select>
        <label>Mô tả</label><textarea id="editDescription" rows="8"></textarea>
        <button class="btn-post" onclick="saveEditedProduct()">Lưu thay đổi</button>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/main.js"></script>
</body>
</html>
