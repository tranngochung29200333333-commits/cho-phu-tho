<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Khách hàng quan tâm | Chợ Phú Thọ</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/professional-upgrade.css?v=20260917-1"></head><body><header class="site-header"><div class="topbar container-wide"><a href="index.html" class="logo">🛒 Chợ Phú Thọ</a><div class="admin-header-actions"><a class="top-manage" href="ban-hang.html">Dashboard</a><a class="top-manage" href="quan-ly-tin.html">Quản lý tin</a><a class="top-manage" href="chat.html">Tin nhắn</a></div></div></header><main class="container pt-dashboard"><section class="pt-dashboard-head"><div><span class="eyebrow">NHÀ BÁN HÀNG</span><h1>Khách hàng quan tâm</h1><p>Theo dõi người đã chat, gọi, Zalo hoặc lưu tin của bạn.</p></div></section><section class="pt-panel"><div class="pt-filter-row"><input id="search" placeholder="Tìm theo tên khách hoặc tin đăng..."><select id="status"><option value="">Tất cả trạng thái</option><option value="new">Mới</option><option value="contacted">Đã liên hệ</option><option value="follow_up">Cần liên hệ lại</option><option value="done">Hoàn tất</option></select></div><div id="leadBox" class="table-wrap"><div class="pt-empty">Đang tải...</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js?v=20260917-1"></script><script>(async()=>{let me=null,rows=[];const box=document.getElementById('leadBox');const fmt=d=>d?new Date(d).toLocaleString('vi-VN'):'-';const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));try{const{data:u}=await supabaseClient.auth.getUser();me=u?.user;if(!me){location.href='dang-nhap.html?next=quan-ly-khach.html';return}const{data:p}=await supabaseClient.from('profiles').select('role').eq('id',me.id).maybeSingle();if(!['seller','admin'].includes(p?.role)){location.href='tai-khoan.html';return}async function load(){const{data,error}=await supabaseClient.from('seller_contacts').select('id,buyer_id,listing_id,contact_type,status,note,reminder_at,created_at,updated_at,profiles:buyer_id(full_name,phone),listings:listing_id(title)').eq('seller_id',me.id).order('created_at',{ascending:false});if(error)throw error;rows=data||[];render()}function render(){const q=document.getElementById('search').value.trim().toLowerCase(),s=document.getElementById('status').value;const filtered=rows.filter(r=>(!s||r.status===s)&&(!q||String(r.profiles?.full_name||'').toLowerCase().includes(q)||String(r.listings?.title||'').toLowerCase().includes(q)));if(!filtered.length){box.innerHTML='<div class="pt-empty">Chưa có khách hàng phù hợp.</div>';return}box.innerHTML='<table class="pt-table"><thead><tr><th>Khách hàng</th><th>Tin</th><th>Kênh</th><th>Trạng thái</th><th>Thời gian</th><th>Thao tác</th></tr></thead><tbody>'+filtered.map(r=>'<tr><td><b>'+esc(r.profiles?.full_name||'Khách hàng')+'</b><br><small>'+esc(r.profiles?.phone||'')+'</small></td><td>'+esc(r.listings?.title||'Tin đã ẩn')+'</td><td>'+esc({chat:'Chat',phone:'Điện thoại',zalo:'Zalo',favorite:'Yêu thích',contact:'Liên hệ'}[r.contact_type]||r.contact_type)+'</td><td><select data-status="'+r.id+'"><option value="new" '+(r.status==='new'?'selected':'')+'>Mới</option><option value="contacted" '+(r.status==='contacted'?'selected':'')+'>Đã liên hệ</option><option value="follow_up" '+(r.status==='follow_up'?'selected':'')+'>Cần liên hệ lại</option><option value="done" '+(r.status==='done'?'selected':'')+'>Hoàn tất</option></select></td><td>'+fmt(r.created_at)+'</td><td><a class="pt-action" href="chat.html?user='+r.buyer_id+(r.listing_id?'&listing='+r.listing_id:'')+'">Chat</a></td></tr>').join('')+'</tbody></table>';box.querySelectorAll('[data-status]').forEach(el=>el.onchange=async()=>{await supabaseClient.from('seller_contacts').update({status:el.value}).eq('id',el.dataset.status).eq('seller_id',me.id);ptToast('Đã cập nhật trạng thái');await load()})}document.getElementById('search').oninput=render;document.getElementById('status').onchange=render;await load()}catch(e){console.error(e);box.innerHTML='<div class="pt-empty">Không thể tải danh sách khách hàng.</div>'}})();</script></body></html>
