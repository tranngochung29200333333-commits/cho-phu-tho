<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lịch sử xem | Chợ Phú Thọ</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/professional-upgrade.css?v=20260917-1"><link rel="stylesheet" href="css/mobile-reference-v2.css?v=20260917-2"></head><body><header class="site-header"><div class="topbar container-wide"><a href="index.html" class="logo">🛒 Chợ Phú Thọ</a><div class="admin-header-actions"><a class="top-manage" href="yeu-thich.html">♡ Yêu thích</a><a class="top-manage" href="chat.html">💬 Tin nhắn</a><a class="top-manage" href="tai-khoan.html">Tài khoản</a></div></div></header><main class="container pt-dashboard"><section class="pt-dashboard-head"><div><span class="eyebrow">CÁ NHÂN</span><h1>Lịch sử xem</h1><p>Các tin bạn đã mở gần đây trên thiết bị này.</p></div><button id="clear" class="pt-action danger">Xóa lịch sử</button></section><section class="pt-panel"><div id="box" class="pt-mini-grid"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js?v=20260917-4"></script><script>(async()=>{const box=document.getElementById('box');let ids=[];try{ids=JSON.parse(localStorage.getItem('pt_recent_listings')||'[]')}catch(e){}if(!ids.length){box.innerHTML='<div class="pt-empty">Bạn chưa xem tin nào.</div>';return}const{data}=await supabaseClient.from('listings').select('id,title,price,location').in('id',ids.map(Number)).eq('status','approved');const fmt=n=>Number(n||0)?Number(n).toLocaleString('vi-VN')+' đ':'Thỏa thuận';const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));box.innerHTML=(data||[]).sort((a,b)=>ids.indexOf(String(a.id))-ids.indexOf(String(b.id))).map(l=>'<a class="pt-mini-card" href="chi-tiet.html?id='+l.id+'"><div class="pt-mini-body"><strong>'+esc(l.title)+'</strong><span>'+fmt(l.price)+'</span><small>'+esc(l.location||'Phú Thọ')+'</small></div></a>').join('')||'<div class="pt-empty">Các tin đã xem không còn hiển thị.</div>';document.getElementById('clear').onclick=()=>{localStorage.removeItem('pt_recent_listings');location.reload()}})();</script></body></html>
