<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng tin bán SIM - Chợ Phú Thọ</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
    <div class="header">
        <a href="index.html" class="logo">🛒 Chợ Phú Thọ</a>
        <a href="index.html">Trang chủ</a>
        <a href="quan-ly-tin.html">Tin của tôi</a>
    </div>
</header>
<main class="container">
    <div class="auth-box wide-box">
        <span class="eyebrow">NHÀ BÁN HÀNG</span>
        <h2>Đăng tin bán SIM</h2>
        <p>Tin mới sẽ ở trạng thái chờ duyệt cho tới khi Admin kiểm tra.</p>
        <label>Số SIM *</label><input type="text" id="simNumber" placeholder="Ví dụ: 0988 888 888">
        <label>Tiêu đề *</label><input type="text" id="title" placeholder="Ví dụ: SIM tam hoa 0988 888 888">
        <label>Giá bán *</label><input type="number" id="price" min="0" placeholder="5000000">
        <label>Nhà mạng *</label>
        <select id="network"><option value="">-- Chọn nhà mạng --</option><option>Viettel</option><option>Vinaphone</option><option>Mobifone</option><option>Vietnamobile</option></select>
        <label>Khu vực *</label>
        <select id="location">
            <option>Việt Trì</option>
            <option>Phú Thọ</option>
            <option>Lâm Thao</option>
            <option>Cẩm Khê</option>
            <option>Hạ Hòa</option>
            <option>Thanh Sơn</option>
            <option>Tân Sơn</option>
            <option>Yên Lập</option>
            <option>Thanh Ba</option>
            <option>Đoan Hùng</option>
            <option>Phù Ninh</option>
            <option>Thanh Thủy</option>
            <option>Tam Nông</option>
        </select>
        <label>Mô tả</label><textarea id="description" rows="7" placeholder="Mô tả tình trạng, cam kết, giao dịch..."></textarea>
        <button class="btn-post" onclick="postSim()">Đăng tin</button>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/main.js"></script>
</body>
</html>
